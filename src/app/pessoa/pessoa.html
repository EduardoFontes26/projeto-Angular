<div class="container">
  <h2>Pessoas</h2>

  <table *ngIf="pessoas.length > 0; else vazio">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Curso</th>
        <th>Email</th>
        <th>Ativo</th>
        <th>Telefone</th>
        <th>Vínculo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pessoa of pessoas">
        <td>{{ pessoa.id }}</td>
        <td>{{ pessoa.nome }}</td>
        <td>{{ pessoa.curso }}</td>
        <td>{{ pessoa.email }}</td>
        <td>{{ pessoa.ativo ? 'Sim' : 'Não' }}</td>
        <td>{{ pessoa.telefone ?? '—' }}</td>
        <td>{{ pessoa.vinculo }}</td>
      </tr>
    </tbody>
  </table>

  <ng-template #vazio>
    <p>Nenhuma pessoa cadastrada.</p>
  </ng-template>
</div>
